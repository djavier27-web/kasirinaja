<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KasirinAja - POS Kasir Modern</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- VIEW 1: LOGIN USER / MERCHANT -->
  <div id="view-login" class="flex min-h-screen items-center justify-center p-4">
    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md fade-in border border-slate-100">
      <div class="text-center mb-8">
        <div class="w-14 h-14 bg-blue-600 rounded-2xl mx-auto mb-3 flex items-center justify-center text-white font-bold text-2xl shadow-lg shadow-blue-500/30">K</div>
        <h1 class="text-2xl font-bold text-slate-900">Masuk KasirinAja</h1>
        <p class="text-sm text-slate-500 mt-1">Kelola penjualan toko Anda dengan mudah</p>
      </div>
      <form onsubmit="loginUser(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Email Toko</label>
          <input type="email" id="login-email" required class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
          <input type="password" id="login-password" required class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm transition">
        </div>
        <button type="submit" class="w-full py-3.5 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-500/25 transition">Masuk ke Kasir</button>
      </form>
    </div>
  </div>

  <!-- VIEW 2: DASHBOARD KASIR MERCHANT -->
  <div id="view-app" class="hidden min-h-screen flex flex-col">
    <!-- Header -->
    <header id="main-header" class="bg-blue-600 text-white shadow-md transition-colors duration-300">
      <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <img id="ui-logo" src="" class="w-10 h-10 rounded-xl object-cover border-2 border-white/30 hidden">
          <div>
            <h1 id="ui-nama-toko" class="font-bold text-lg leading-tight">Nama Toko</h1>
            <p id="ui-alamat" class="text-xs text-white/80">Alamat Toko</p>
          </div>
        </div>
        <nav class="flex items-center space-x-2">
          <button onclick="switchTab('kasir')" class="px-3.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 transition text-sm font-medium">Kasir</button>
          <button onclick="switchTab('produk')" class="px-3.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 transition text-sm font-medium">Produk</button>
          <button onclick="switchTab('keuangan')" class="px-3.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 transition text-sm font-medium">Keuangan</button>
          <button onclick="switchTab('pengaturan')" class="px-3.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 transition text-sm font-medium">Custom Struk</button>
          <button onclick="logout()" class="px-3 py-1.5 rounded-xl bg-rose-500/80 hover:bg-rose-600 transition text-xs font-bold ml-2">Keluar</button>
        </nav>
      </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 flex-1 w-full">

      <!-- TAB KASIR -->
      <section id="tab-kasir" class="grid grid-cols-1 md:grid-cols-3 gap-6 fade-in">
        <div class="md:col-span-2 bg-white p-5 rounded-3xl shadow-sm border border-slate-200/60">
          <h2 class="text-base font-bold mb-4 text-slate-800">Katalog Produk</h2>
          <div id="grid-produk" class="grid grid-cols-2 sm:grid-cols-3 gap-4"></div>
        </div>
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200/60 flex flex-col justify-between">
          <div>
            <h2 class="text-base font-bold mb-3 text-slate-800">Keranjang Belanja</h2>
            <div class="mb-3">
              <label class="block text-xs font-semibold text-slate-500 mb-1">Kasir Melayani</label>
              <input type="text" id="kasir-bertugas" placeholder="Nama Kasir" class="w-full p-2.5 border rounded-xl text-xs bg-slate-50 outline-none">
            </div>
            <div id="items-keranjang" class="space-y-2 max-h-52 overflow-y-auto pr-1 divide-y"></div>
          </div>
          <div class="border-t pt-3 mt-3 space-y-2">
            <div class="flex justify-between text-lg font-bold">
              <span>Total:</span>
              <span id="total-bayar" class="text-emerald-600">Rp 0</span>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Uang Tunai (Cash)</label>
              <input type="number" id="uang-diterima" oninput="hitungKembalian()" placeholder="0" class="w-full p-2.5 border rounded-xl text-base font-bold outline-none">
            </div>
            <div class="flex justify-between text-sm font-semibold">
              <span>Kembalian:</span>
              <span id="uang-kembalian" class="text-blue-600">Rp 0</span>
            </div>
            <button id="btn-proses-bayar" onclick="prosesBayarCetak()" class="w-full py-3.5 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:opacity-90 transition mt-2">
              Bayar & Cetak Struk
            </button>
          </div>
        </div>
      </section>

      <!-- TAB PRODUK -->
      <section id="tab-produk" class="hidden max-w-xl mx-auto bg-white p-6 rounded-3xl shadow-sm border border-slate-200/60 fade-in">
        <h2 class="text-base font-bold mb-4 text-slate-800">Tambah Produk Baru</h2>
        <form onsubmit="tambahProduk(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Produk</label>
            <input type="text" id="prod-nama" required class="w-full p-3 border rounded-xl text-sm outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Harga (Rp)</label>
            <input type="number" id="prod-harga" required class="w-full p-3 border rounded-xl text-sm outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Unggah Foto Produk (Dari Perangkat)</label>
            <input type="file" id="prod-foto-file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
          </div>
          <button type="submit" class="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow transition text-sm">Simpan Produk</button>
        </form>
      </section>

      <!-- TAB KEUANGAN -->
      <section id="tab-keuangan" class="hidden space-y-6 fade-in">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/60">
            <h3 class="font-bold text-emerald-600 text-sm mb-3">Catat Pemasukan</h3>
            <form onsubmit="catatTransaksi(event, 'pemasukan')" class="flex gap-2">
              <input type="number" id="in-pemasukan" placeholder="Jumlah (Rp)" required class="flex-1 p-2.5 border rounded-xl text-sm">
              <input type="text" id="ket-pemasukan" placeholder="Keterangan" class="flex-1 p-2.5 border rounded-xl text-sm">
              <button class="px-4 py-2.5 bg-emerald-600 text-white rounded-xl font-bold text-sm">Simpan</button>
            </form>
          </div>
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/60">
            <h3 class="font-bold text-rose-600 text-sm mb-3">Catat Pengeluaran</h3>
            <form onsubmit="catatTransaksi(event, 'pengeluaran')" class="flex gap-2">
              <input type="number" id="in-pengeluaran" placeholder="Jumlah (Rp)" required class="flex-1 p-2.5 border rounded-xl text-sm">
              <input type="text" id="ket-pengeluaran" placeholder="Keterangan" class="flex-1 p-2.5 border rounded-xl text-sm">
              <button class="px-4 py-2.5 bg-rose-600 text-white rounded-xl font-bold text-sm">Simpan</button>
            </form>
          </div>
        </div>
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/60">
          <h3 class="font-bold text-slate-800 text-sm mb-4">Riwayat Transaksi</h3>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead class="bg-slate-50 text-slate-500">
                <tr>
                  <th class="p-3">Tanggal</th>
                  <th class="p-3">Tipe</th>
                  <th class="p-3">Jumlah</th>
                  <th class="p-3">Keterangan</th>
                </tr>
              </thead>
              <tbody id="tabel-transaksi"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- TAB CUSTOM STRUK -->
      <section id="tab-pengaturan" class="hidden max-w-xl mx-auto bg-white p-6 rounded-3xl shadow-sm border border-slate-200/60 fade-in">
        <h2 class="text-base font-bold mb-4 text-slate-800">Kustomisasi Struk & Tampilan UI</h2>
        <form onsubmit="simpanSettings(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Toko</label>
            <input type="text" id="set-nama-toko" required class="w-full p-2.5 border rounded-xl text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Alamat Toko</label>
            <input type="text" id="set-alamat-toko" class="w-full p-2.5 border rounded-xl text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Kasir Default</label>
            <input type="text" id="set-nama-kasir" class="w-full p-2.5 border rounded-xl text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Unggah Logo Toko (Dari Perangkat)</label>
            <input type="file" id="set-logo-file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Pesan Struk Footer</label>
            <input type="text" id="set-header-struk" class="w-full p-2.5 border rounded-xl text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Warna UI Kasir</label>
            <input type="color" id="set-warna" class="w-full h-10 p-1 border rounded-xl cursor-pointer">
          </div>
          <button type="submit" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl text-sm">Simpan Perubahan</button>
        </form>
      </section>

    </main>
  </div>

  <script>
    let activeUser = JSON.parse(localStorage.getItem('kasirin_user')) || null;
    let keranjang = [];

    // Utility: Kompresi File Gambar ke Base64 (Tanpa URL)
    function compressImageToBase64(file, maxWidth = 300) {
      return new Promise((resolve) => {
        if (!file) return resolve('');
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const scale = maxWidth / img.width;
            canvas.width = maxWidth;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.8));
          };
        };
      });
    }

    async function loginUser(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, expected_role: 'user' })
      });

      const data = await res.json();
      if (res.ok) {
        activeUser = data;
        localStorage.setItem('kasirin_user', JSON.stringify(data));
        initApp();
      } else {
        alert(data.error || 'Login gagal!');
      }
    }

    function logout() {
      localStorage.removeItem('kasirin_user');
      location.reload();
    }

    function initApp() {
      if (!activeUser) {
        document.getElementById('view-login').classList.remove('hidden');
        document.getElementById('view-app').classList.add('hidden');
        return;
      }

      document.getElementById('view-login').classList.add('hidden');
      document.getElementById('view-app').classList.remove('hidden');

      terapkanUI(activeUser);
      loadProduk();
      loadTransaksi();
    }

    function terapkanUI(u) {
      document.getElementById('ui-nama-toko').innerText = u.nama_toko;
      document.getElementById('ui-alamat').innerText = u.alamat_toko || 'Alamat Toko';
      document.getElementById('main-header').style.backgroundColor = u.warna_ui || '#2563eb';
      document.getElementById('btn-proses-bayar').style.backgroundColor = u.warna_ui || '#2563eb';

      const img = document.getElementById('ui-logo');
      if (u.logo_data) {
        img.src = u.logo_data;
        img.classList.remove('hidden');
      } else {
        img.classList.add('hidden');
      }

      document.getElementById('set-nama-toko').value = u.nama_toko || '';
      document.getElementById('set-alamat-toko').value = u.alamat_toko || '';
      document.getElementById('set-nama-kasir').value = u.nama_kasir || 'Kasir 1';
      document.getElementById('kasir-bertugas').value = u.nama_kasir || 'Kasir 1';
      document.getElementById('set-warna').value = u.warna_ui || '#2563eb';
      document.getElementById('set-header-struk').value = u.header_struk || 'Terima kasih!';
    }

    function switchTab(tab) {
      ['kasir', 'produk', 'keuangan', 'pengaturan'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
    }

    async function loadProduk() {
      const res = await fetch(`/api/products?user_id=${activeUser.id}`);
      const prods = await res.json();
      const grid = document.getElementById('grid-produk');
      grid.innerHTML = '';

      prods.forEach(p => {
        const div = document.createElement('div');
        div.className = 'border rounded-2xl p-3 text-center cursor-pointer hover:scale-[1.02] transition bg-white flex flex-col justify-between shadow-sm';
        div.onclick = () => tambahKeKeranjang(p);
        div.innerHTML = `
          <img src="${p.foto_data || 'https://via.placeholder.com/150'}" class="w-full h-24 object-cover rounded-xl mb-2">
          <div class="font-bold text-xs truncate text-slate-800">${p.nama_produk}</div>
          <div class="text-xs text-emerald-600 font-bold mt-1">Rp ${Number(p.harga).toLocaleString()}</div>
        `;
        grid.appendChild(div);
      });
    }

    function tambahKeKeranjang(p) {
      const exist = keranjang.find(k => k.id === p.id);
      if (exist) exist.qty += 1;
      else keranjang.push({ ...p, qty: 1 });
      renderKeranjang();
    }

    function renderKeranjang() {
      const container = document.getElementById('items-keranjang');
      container.innerHTML = '';
      let total = 0;

      keranjang.forEach(k => {
        const sub = k.harga * k.qty;
        total += sub;
        const row = document.createElement('div');
        row.className = 'flex justify-between items-center py-2 text-xs';
        row.innerHTML = `
          <div>
            <div class="font-semibold text-slate-800">${k.nama_produk}</div>
            <div class="text-slate-400">${k.qty} x Rp ${Number(k.harga).toLocaleString()}</div>
          </div>
          <div class="font-bold">Rp ${sub.toLocaleString()}</div>
        `;
        container.appendChild(row);
      });

      document.getElementById('total-bayar').innerText = `Rp ${total.toLocaleString()}`;
      hitungKembalian();
    }

    function hitungKembalian() {
      const total = keranjang.reduce((sum, k) => sum + (k.harga * k.qty), 0);
      const uang = Number(document.getElementById('uang-diterima').value) || 0;
      const kembalian = uang - total;

      const spanKembalian = document.getElementById('uang-kembalian');
      if (kembalian >= 0) {
        spanKembalian.innerText = `Rp ${kembalian.toLocaleString()}`;
        spanKembalian.className = 'text-blue-600 font-bold';
      } else {
        spanKembalian.innerText = `Kurang Rp ${Math.abs(kembalian).toLocaleString()}`;
        spanKembalian.className = 'text-rose-600 font-bold';
      }
    }

    async function prosesBayarCetak() {
      if (keranjang.length === 0) return alert('Keranjang belanja kosong!');
      const total = keranjang.reduce((sum, k) => sum + (k.harga * k.qty), 0);
      const uang = Number(document.getElementById('uang-diterima').value) || 0;

      if (uang < total) return alert('Uang pembayaran tunai kurang!');

      const namaKasir = document.getElementById('kasir-bertugas').value || 'Kasir';

      await fetch('/api/transactions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: activeUser.id,
          tipe: 'pemasukan',
          jumlah: total,
          keterangan: `Penjualan Kasir (Kasir: ${namaKasir})`
        })
      });

      cetakStrukThermal(total, uang, uang - total, namaKasir);
      keranjang = [];
      document.getElementById('uang-diterima').value = '';
      renderKeranjang();
      loadTransaksi();
    }

    function cetakStrukThermal(total, uang, kembalian, namaKasir) {
      const win = window.open('', '', 'width=300,height=600');
      const wkt = new Date();
      const tanggalWaktu = `${wkt.toLocaleDateString('id-ID')} ${wkt.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}`;

      let items = '';
      keranjang.forEach(k => {
        items += `<div style="display:flex;justify-content:space-between;font-size:11px;"><span>${k.nama_produk} x${k.qty}</span><span>${(k.harga * k.qty).toLocaleString()}</span></div>`;
      });

      const logoHtml = activeUser.logo_data ? `<div style="text-align:center;"><img src="${activeUser.logo_data}" style="max-width:40px;margin-bottom:4px;"></div>` : '';

      win.document.write(`
        <html>
          <head>
            <style>
              body { font-family: monospace; width: 58mm; padding: 4px; font-size: 11px; margin: 0; }
              .center { text-align: center; }
              .flex-between { display: flex; justify-content: space-between; }
              hr { border-top: 1px dashed #000; margin: 4px 0; }
            </style>
          </head>
          <body>
            ${logoHtml}
            <div class="center">
              <strong>${activeUser.nama_toko}</strong><br>
              <span style="font-size:10px;">${activeUser.alamat_toko || ''}</span>
            </div>
            <hr>
            <div style="font-size:10px;">
              <div>Tgl  : ${tanggalWaktu}</div>
              <div>Kasir: ${namaKasir}</div>
            </div>
            <hr>
            ${items}
            <hr>
            <div class="flex-between" style="font-weight:bold;"><span>TOTAL</span><span>Rp ${total.toLocaleString()}</span></div>
            <div class="flex-between"><span>TUNAI</span><span>Rp ${uang.toLocaleString()}</span></div>
            <div class="flex-between"><span>KEMBALI</span><span>Rp ${kembalian.toLocaleString()}</span></div>
            <hr>
            <div class="center" style="font-size:10px;"><p>${activeUser.header_struk || 'Terima Kasih!'}</p></div>
          </body>
        </html>
      `);
      win.document.close();
      win.focus();
      win.print();
      win.close();
    }

    async function tambahProduk(e) {
      e.preventDefault();
      const fileInput = document.getElementById('prod-foto-file');
      const foto_data = await compressImageToBase64(fileInput.files[0]);

      await fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: activeUser.id,
          nama_produk: document.getElementById('prod-nama').value,
          harga: document.getElementById('prod-harga').value,
          foto_data
        })
      });

      alert('Produk berhasil disimpan!');
      e.target.reset();
      loadProduk();
      switchTab('kasir');
    }

    async function catatTransaksi(e, tipe) {
      e.preventDefault();
      await fetch('/api/transactions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: activeUser.id,
          tipe,
          jumlah: document.getElementById(`in-${tipe}`).value,
          keterangan: document.getElementById(`ket-${tipe}`).value
        })
      });
      alert('Transaksi dicatat!');
      e.target.reset();
      loadTransaksi();
    }

    async function loadTransaksi() {
      const res = await fetch(`/api/transactions?user_id=${activeUser.id}`);
      const data = await res.json();
      const tbody = document.getElementById('tabel-transaksi');
      tbody.innerHTML = '';

      data.forEach(t => {
        const tr = document.createElement('tr');
        tr.className = 'border-b border-slate-100 hover:bg-slate-50';
        tr.innerHTML = `
          <td class="p-3 text-xs text-slate-500">${new Date(t.created_at).toLocaleDateString('id-ID')}</td>
          <td class="p-3 font-bold ${t.tipe === 'pemasukan' ? 'text-emerald-600' : 'text-rose-600'}">${t.tipe.toUpperCase()}</td>
          <td class="p-3 font-semibold">Rp ${Number(t.jumlah).toLocaleString()}</td>
          <td class="p-3 text-slate-500">${t.keterangan || '-'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function simpanSettings(e) {
      e.preventDefault();
      const logoFile = document.getElementById('set-logo-file').files[0];
      let logo_data = activeUser.logo_data;

      if (logoFile) {
        logo_data = await compressImageToBase64(logoFile);
      }

      const res = await fetch(`/api/users/${activeUser.id}/settings`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nama_toko: document.getElementById('set-nama-toko').value,
          alamat_toko: document.getElementById('set-alamat-toko').value,
          nama_kasir: document.getElementById('set-nama-kasir').value,
          warna_ui: document.getElementById('set-warna').value,
          logo_data,
          header_struk: document.getElementById('set-header-struk').value
        })
      });

      const updated = await res.json();
      activeUser = updated;
      localStorage.setItem('kasirin_user', JSON.stringify(updated));
      alert('Pengaturan disimpan!');
      initApp();
    }

    window.onload = initApp;
  </script>
</body>
</html>
