<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KasirinAja - Aplikasi Kasir Minimalis</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen antialiased">

  <!-- Header Dinamis -->
  <header id="main-header" class="bg-blue-600 text-white shadow-sm transition-colors duration-300">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <img id="ui-logo" src="" alt="Logo" class="w-9 h-9 rounded-lg object-cover border border-white/20 hidden">
        <div>
          <h1 id="ui-nama-toko" class="font-bold text-lg leading-tight">KasirinAja</h1>
          <select id="user-switcher" onchange="gantiUser(this.value)" class="bg-black/20 text-xs px-2 py-0.5 rounded border border-white/20 text-white focus:outline-none"></select>
        </div>
      </div>
      <nav class="flex space-x-1 text-sm font-medium">
        <button onclick="switchTab('kasir')" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 transition">Kasir</button>
        <button onclick="switchTab('produk')" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 transition">Produk</button>
        <button onclick="switchTab('keuangan')" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 transition">Keuangan</button>
        <button onclick="switchTab('pengaturan')" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 transition">Custom UI</button>
        <button id="nav-dev" onclick="switchTab('developer')" class="px-3 py-1.5 rounded-lg bg-slate-900/40 hover:bg-slate-900/60 transition hidden">Dev Panel</button>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-6">

    <!-- TAB 1: KASIR (POS) -->
    <section id="tab-kasir" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="md:col-span-2 bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
        <h2 class="text-base font-bold mb-4 text-slate-700">Katalog Produk</h2>
        <div id="grid-produk" class="grid grid-cols-2 sm:grid-cols-3 gap-4"></div>
      </div>
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
        <div>
          <h2 class="text-base font-bold mb-4 text-slate-700">Keranjang Belanja</h2>
          <div id="items-keranjang" class="space-y-2 max-h-64 overflow-y-auto pr-1 divide-y divide-slate-100"></div>
        </div>
        <div class="border-t pt-4 mt-4">
          <div class="flex justify-between text-lg font-bold mb-4">
            <span>Total:</span>
            <span id="total-bayar" class="text-emerald-600">Rp 0</span>
          </div>
          <button id="btn-proses-bayar" onclick="prosesBayarCetak()" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl shadow-sm hover:opacity-95 transition">
            Bayar & Cetak Struk
          </button>
        </div>
      </div>
    </section>

    <!-- TAB 2: TAMBAH PRODUK -->
    <section id="tab-produk" class="hidden max-w-lg mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
      <h2 class="text-base font-bold mb-4 text-slate-700">Tambah Produk Baru</h2>
      <form onsubmit="tambahProduk(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Produk</label>
          <input type="text" id="prod-nama" required class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Harga (Rp)</label>
          <input type="number" id="prod-harga" required class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">URL Foto Produk</label>
          <input type="url" id="prod-foto" placeholder="https://..." class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
        </div>
        <button type="submit" class="w-full py-2.5 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 transition text-sm">Simpan Produk</button>
      </form>
    </section>

    <!-- TAB 3: KEUANGAN -->
    <section id="tab-keuangan" class="hidden space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
          <h3 class="font-bold text-emerald-600 text-sm mb-3">Catat Pemasukan Lain</h3>
          <form onsubmit="catatTransaksi(event, 'pemasukan')" class="flex gap-2">
            <input type="number" id="in-pemasukan" placeholder="Jumlah (Rp)" required class="flex-1 p-2 border rounded-xl text-sm">
            <input type="text" id="ket-pemasukan" placeholder="Keterangan" class="flex-1 p-2 border rounded-xl text-sm">
            <button class="px-4 py-2 bg-emerald-600 text-white rounded-xl font-bold text-sm">Simpan</button>
          </form>
        </div>
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
          <h3 class="font-bold text-rose-600 text-sm mb-3">Catat Pengeluaran</h3>
          <form onsubmit="catatTransaksi(event, 'pengeluaran')" class="flex gap-2">
            <input type="number" id="in-pengeluaran" placeholder="Jumlah (Rp)" required class="flex-1 p-2 border rounded-xl text-sm">
            <input type="text" id="ket-pengeluaran" placeholder="Keterangan" class="flex-1 p-2 border rounded-xl text-sm">
            <button class="px-4 py-2 bg-rose-600 text-white rounded-xl font-bold text-sm">Simpan</button>
          </form>
        </div>
      </div>
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
        <h3 class="font-bold text-slate-700 text-sm mb-4">Riwayat Transaksi</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-50 border-b border-slate-100 text-slate-500">
              <tr>
                <th class="p-3">Tanggal</th>
                <th class="p-3">Tipe</th>
                <th class="p-3">Jumlah</th>
                <th class="p-3">Keterangan</th>
              </tr>
            </thead>
            <tbody id="tabel-transaksi"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- TAB 4: CUSTOM UI & STRUK -->
    <section id="tab-pengaturan" class="hidden max-w-lg mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
      <h2 class="text-base font-bold mb-4 text-slate-700">Kustomisasi Tampilan & Struk</h2>
      <form onsubmit="simpanSettings(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Warna UI Kasir</label>
          <input type="color" id="set-warna" class="w-full h-10 p-1 border rounded-xl cursor-pointer">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">URL Logo Toko</label>
          <input type="url" id="set-logo" placeholder="https://..." class="w-full p-2.5 border rounded-xl text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Pesan Struk Footer</label>
          <input type="text" id="set-header-struk" class="w-full p-2.5 border rounded-xl text-sm">
        </div>
        <button type="submit" class="w-full py-2.5 bg-blue-600 text-white font-bold rounded-xl text-sm">Simpan Perubahan</button>
      </form>
    </section>

    <!-- TAB 5: DEVELOPER DASHBOARD -->
    <section id="tab-developer" class="hidden max-w-lg mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
      <div class="flex items-center space-x-2 mb-2">
        <span class="bg-slate-900 text-white text-xs px-2 py-0.5 rounded font-mono">SUPERADMIN</span>
        <h2 class="text-base font-bold text-slate-800">Developer Dashboard</h2>
      </div>
      <p class="text-xs text-slate-500 mb-4">Buat akun merchant/toko baru di bawah ini.</p>
      <form onsubmit="buatAkun(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Toko Merchant</label>
          <input type="text" id="dev-nama-toko" required class="w-full p-2.5 border rounded-xl text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Email Merchant</label>
          <input type="email" id="dev-email" required class="w-full p-2.5 border rounded-xl text-sm">
        </div>
        <button type="submit" class="w-full py-2.5 bg-slate-900 text-white font-bold rounded-xl text-sm hover:bg-slate-800 transition">Buat Akun Toko Baru</button>
      </form>
    </section>

  </main>

  <script>
    let allUsers = [];
    let activeUser = null;
    let keranjang = [];

    async function init() {
      const res = await fetch('/api/users');
      allUsers = await res.json();
      
      const select = document.getElementById('user-switcher');
      select.innerHTML = '';
      allUsers.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.id;
        opt.innerText = `${u.nama_toko} (${u.role})`;
        select.appendChild(opt);
      });

      if (allUsers.length > 0) {
        gantiUser(allUsers[0].id);
      }
    }

    function gantiUser(userId) {
      activeUser = allUsers.find(u => u.id === userId);
      terapkanUI(activeUser);
      loadProduk();
      loadTransaksi();
    }

    function terapkanUI(u) {
      document.getElementById('ui-nama-toko').innerText = u.nama_toko;
      document.getElementById('main-header').style.backgroundColor = u.warna_ui || '#2563eb';
      document.getElementById('btn-proses-bayar').style.backgroundColor = u.warna_ui || '#2563eb';

      const img = document.getElementById('ui-logo');
      if (u.logo_url) {
        img.src = u.logo_url;
        img.classList.remove('hidden');
      } else {
        img.classList.add('hidden');
      }

      document.getElementById('set-warna').value = u.warna_ui || '#2563eb';
      document.getElementById('set-logo').value = u.logo_url || '';
      document.getElementById('set-header-struk').value = u.header_struk || 'Terima kasih!';

      const devNav = document.getElementById('nav-dev');
      if (u.role === 'developer') {
        devNav.classList.remove('hidden');
      } else {
        devNav.classList.add('hidden');
      }
    }

    function switchTab(tab) {
      ['kasir', 'produk', 'keuangan', 'pengaturan', 'developer'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
    }

    async function loadProduk() {
      const res = await fetch(`/api/products?user_id=${activeUser.id}`);
      const prods = await res.json();
      const grid = document.getElementById('grid-produk');
      grid.innerHTML = '';

      prods.forEach(p => {
        const div = document.createElement('div');
        div.className = 'border rounded-xl p-3 text-center cursor-pointer hover:shadow-md transition bg-white flex flex-col justify-between';
        div.onclick = () => tambahKeKeranjang(p);
        div.innerHTML = `
          <img src="${p.foto_url || 'https://via.placeholder.com/150'}" class="w-full h-24 object-cover rounded-lg mb-2">
          <div class="font-bold text-xs truncate text-slate-800">${p.nama_produk}</div>
          <div class="text-xs text-emerald-600 font-semibold mt-1">Rp ${Number(p.harga).toLocaleString()}</div>
        `;
        grid.appendChild(div);
      });
    }

    function tambahKeKeranjang(p) {
      const exist = keranjang.find(k => k.id === p.id);
      if (exist) exist.qty += 1;
      else keranjang.push({ ...p, qty: 1 });
      renderKeranjang();
    }

    function renderKeranjang() {
      const container = document.getElementById('items-keranjang');
      container.innerHTML = '';
      let total = 0;

      keranjang.forEach(k => {
        const sub = k.harga * k.qty;
        total += sub;
        const row = document.createElement('div');
        row.className = 'flex justify-between items-center py-2 text-xs';
        row.innerHTML = `
          <div>
            <div class="font-semibold text-slate-700">${k.nama_produk}</div>
            <div class="text-slate-400">${k.qty} x Rp ${Number(k.harga).toLocaleString()}</div>
          </div>
          <div class="font-bold">Rp ${sub.toLocaleString()}</div>
        `;
        container.appendChild(row);
      });

      document.getElementById('total-bayar').innerText = `Rp ${total.toLocaleString()}`;
    }

    async function prosesBayarCetak() {
      if (keranjang.length === 0) return alert('Keranjang belanja kosong!');
      const total = keranjang.reduce((sum, k) => sum + (k.harga * k.qty), 0);

      await fetch('/api/transactions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: activeUser.id,
          tipe: 'pemasukan',
          jumlah: total,
          keterangan: 'Penjualan Kasir'
        })
      });

      cetakStrukThermal(total);
      keranjang = [];
      renderKeranjang();
      loadTransaksi();
    }

    function cetakStrukThermal(total) {
      const win = window.open('', '', 'width=300,height=600');
      let items = '';
      keranjang.forEach(k => {
        items += `<div style="display:flex;justify-between;font-size:11px;"><span>${k.nama_produk} x${k.qty}</span><span>${(k.harga * k.qty).toLocaleString()}</span></div>`;
      });

      win.document.write(`
        <html>
          <head>
            <style>
              body { font-family: monospace; width: 58mm; padding: 4px; font-size: 11px; }
              .center { text-align: center; }
              hr { border-top: 1px dashed #000; margin: 4px 0; }
            </style>
          </head>
          <body>
            <div class="center">
              <h3>${activeUser.nama_toko}</h3>
            </div>
            <hr>
            ${items}
            <hr>
            <div style="display:flex;justify-between;font-weight:bold;">
              <span>TOTAL</span><span>Rp ${total.toLocaleString()}</span>
            </div>
            <hr>
            <div class="center"><p>${activeUser.header_struk || 'Terima Kasih!'}</p></div>
          </body>
        </html>
      `);
      win.document.close();
      win.focus();
      win.print();
      win.close();
    }

    async function tambahProduk(e) {
      e.preventDefault();
      await fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: activeUser.id,
          nama_produk: document.getElementById('prod-nama').value,
          harga: document.getElementById('prod-harga').value,
          foto_url: document.getElementById('prod-foto').value
        })
      });
      alert('Produk berhasil disimpan!');
      e.target.reset();
      loadProduk();
      switchTab('kasir');
    }

    async function catatTransaksi(e, tipe) {
      e.preventDefault();
      await fetch('/api/transactions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: activeUser.id,
          tipe,
          jumlah: document.getElementById(`in-${tipe}`).value,
          keterangan: document.getElementById(`ket-${tipe}`).value
        })
      });
      alert('Transaksi berhasil disimpan!');
      e.target.reset();
      loadTransaksi();
    }

    async function loadTransaksi() {
      const res = await fetch(`/api/transactions?user_id=${activeUser.id}`);
      const data = await res.json();
      const tbody = document.getElementById('tabel-transaksi');
      tbody.innerHTML = '';

      data.forEach(t => {
        const tr = document.createElement('tr');
        tr.className = 'border-b border-slate-50 hover:bg-slate-50';
        tr.innerHTML = `
          <td class="p-3 text-xs text-slate-500">${new Date(t.created_at).toLocaleDateString('id-ID')}</td>
          <td class="p-3 font-semibold ${t.tipe === 'pemasukan' ? 'text-emerald-600' : 'text-rose-600'}">${t.tipe.toUpperCase()}</td>
          <td class="p-3 font-medium">Rp ${Number(t.jumlah).toLocaleString()}</td>
          <td class="p-3 text-slate-500">${t.keterangan || '-'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function simpanSettings(e) {
      e.preventDefault();
      const res = await fetch(`/api/users/${activeUser.id}/settings`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          warna_ui: document.getElementById('set-warna').value,
          logo_url: document.getElementById('set-logo').value,
          header_struk: document.getElementById('set-header-struk').value
        })
      });
      await res.json();
      alert('Custom UI & Struk berhasil disimpan!');
      init();
    }

    async function buatAkun(e) {
      e.preventDefault();
      await fetch('/api/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nama_toko: document.getElementById('dev-nama-toko').value,
          email: document.getElementById('dev-email').value,
          role: 'user'
        })
      });
      alert('Akun Toko Merchant berhasil dibuat oleh Developer!');
      e.target.reset();
      init();
    }

    window.onload = init;
  </script>
</body>
</html>
