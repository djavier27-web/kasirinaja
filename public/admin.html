<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Portal - KasirinAja Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- LOGIN ADMIN -->
  <div id="admin-login" class="flex min-h-screen items-center justify-center p-4">
    <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-700">
      <div class="text-center mb-6">
        <span class="bg-blue-600 text-white text-xs font-mono px-3 py-1 rounded-full uppercase tracking-widest font-bold">Developer Portal</span>
        <h1 class="text-2xl font-bold mt-3">KasirinAja Admin</h1>
      </div>
      <form onsubmit="loginAdmin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Email Developer</label>
          <input type="email" id="admin-email" value="admin@kasirinaja.com" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Password</label>
          <input type="password" id="admin-pass" value="admin123" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
        </div>
        <button type="submit" class="w-full py-3.5 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-500 transition">Masuk Admin Portal</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD ADMIN -->
  <div id="admin-dashboard" class="hidden min-h-screen flex flex-col">
    <header class="bg-slate-800 border-b border-slate-700 p-4">
      <div class="max-w-7xl mx-auto flex justify-between items-center">
        <h1 class="font-bold text-lg">KasirinAja <span class="text-blue-500 text-xs font-mono ml-2">DEV DASHBOARD</span></h1>
        <button onclick="logoutAdmin()" class="px-3 py-1.5 bg-rose-600 rounded-xl text-xs font-bold hover:bg-rose-500">Keluar</button>
      </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 flex-1 w-full space-y-6">
      
      <!-- Metrics -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
          <div class="text-xs text-slate-400 font-semibold mb-1">Total Toko Merchant</div>
          <div id="stat-merchants" class="text-3xl font-bold text-white">0</div>
        </div>
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
          <div class="text-xs text-slate-400 font-semibold mb-1">Total Omset Platform</div>
          <div id="stat-revenue" class="text-3xl font-bold text-emerald-400">Rp 0</div>
        </div>
      </div>

      <!-- Tambah Merchant Form -->
      <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
        <h2 class="font-bold text-sm mb-4 text-slate-200">Buat Akun Merchant Baru</h2>
        <form onsubmit="buatToko(event)" class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <input type="text" id="dev-nama-toko" placeholder="Nama Toko" required class="p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm">
          <input type="email" id="dev-email" placeholder="Email Merchant" required class="p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm">
          <input type="password" id="dev-pass" placeholder="Password (default 123456)" class="p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm">
          <button class="md:col-span-3 py-3 bg-blue-600 font-bold rounded-xl hover:bg-blue-500 text-sm">Daftarkan Toko</button>
        </form>
      </div>

      <!-- List Merchant -->
      <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
        <h2 class="font-bold text-sm mb-4 text-slate-200">Daftar Toko & Penghasilan</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-900 text-slate-400 border-b border-slate-700">
              <tr>
                <th class="p-3">Nama Toko</th>
                <th class="p-3">Email</th>
                <th class="p-3">Total Omset Toko</th>
                <th class="p-3">Tanggal Dibuat</th>
                <th class="p-3">Aksi</th>
              </tr>
            </thead>
            <tbody id="tabel-merchants"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script>
    async function loginAdmin(e) {
      e.preventDefault();
      const email = document.getElementById('admin-email').value;
      const password = document.getElementById('admin-pass').value;

      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, expected_role: 'developer' })
      });

      if (res.ok) {
        document.getElementById('admin-login').classList.add('hidden');
        document.getElementById('admin-dashboard').classList.remove('hidden');
        loadAdminStats();
      } else {
        alert('Akses Admin Ditolak!');
      }
    }

    function logoutAdmin() { location.reload(); }

    async function loadAdminStats() {
      const res = await fetch('/api/admin/stats');
      const data = await res.json();

      document.getElementById('stat-merchants').innerText = data.total_merchants;
      document.getElementById('stat-revenue').innerText = `Rp ${Number(data.total_platform_revenue).toLocaleString()}`;

      const tbody = document.getElementById('tabel-merchants');
      tbody.innerHTML = '';

      data.merchants.forEach(m => {
        const tr = document.createElement('tr');
        tr.className = 'border-b border-slate-700/50 hover:bg-slate-700/30';
        tr.innerHTML = `
          <td class="p-3 font-bold">${m.nama_toko}</td>
          <td class="p-3 text-slate-400">${m.email}</td>
          <td class="p-3 font-semibold text-emerald-400">Rp ${Number(m.total_omset).toLocaleString()}</td>
          <td class="p-3 text-slate-400 text-xs">${new Date(m.created_at).toLocaleDateString('id-ID')}</td>
          <td class="p-3"><button onclick="hapusToko('${m.id}')" class="text-rose-400 hover:underline text-xs font-bold">Hapus</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function buatToko(e) {
      e.preventDefault();
      await fetch('/api/admin/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nama_toko: document.getElementById('dev-nama-toko').value,
          email: document.getElementById('dev-email').value,
          password: document.getElementById('dev-pass').value || '123456'
        })
      });
      alert('Toko berhasil didaftarkan!');
      e.target.reset();
      loadAdminStats();
    }

    async function hapusToko(id) {
      if (!confirm('Yakin ingin menghapus toko ini?')) return;
      await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
      loadAdminStats();
    }
  </script>
</body>
</html>
